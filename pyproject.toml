[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iagent-reproduction"
version = "0.1.0"
description = "Educational functional reproduction of iAgent and i2Agent"
requires-python = ">=3.10"

[project.optional-dependencies]
dev = ["pytest>=8"]
qwen = ["openai>=1.40"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["iagent_reproduction*"]
